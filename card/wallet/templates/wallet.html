<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wallet</title>
<style>{{ css|safe }}</style>
</head>
<body class="m-0 bg-transparent p-2 font-sans text-[0.9375rem] leading-snug text-ink">
<main id="root" class="mx-auto max-w-sm"></main>
<template id="t-wallet">
  <article class="grid grid-cols-1 gap-4 rounded-card border border-line bg-raised p-5">
    <div>
      <h2 class="m-0 text-sm font-normal text-ink-3">Wallet</h2>
      <p data-slot="balance" class="m-0 text-4xl font-semibold tracking-tight tabular-nums"></p>
    </div>
    <ul data-slot="entries" class="m-0 list-none p-0 text-sm empty:hidden"></ul>
    <div class="grid grid-cols-1 gap-2">
      <div class="flex gap-2">
        <label for="amount" class="sr-only">Amount in naira</label>
        <input id="amount" data-slot="amount" placeholder="Amount (₦)" inputmode="numeric" autocomplete="off" enterkeyhint="go" maxlength="9" class="field min-h-11 min-w-0 flex-1 py-3 tabular-nums">
        <button type="button" data-action="add" class="btn-primary w-auto shrink-0">Add money</button>
      </div>
      <button type="button" data-action="pay" data-slot="pay" class="btn-secondary" hidden></button>
    </div>
    <p data-slot="notice" role="alert" class="m-0 text-sm font-medium text-bad" hidden></p>
  </article>
</template>
<template id="t-entry">
  <li class="flex justify-between gap-4 border-t border-line py-2">
    <span data-slot="label" class="min-w-0 text-ink-2"></span>
    <span data-slot="amount" class="shrink-0 whitespace-nowrap tabular-nums"></span>
  </li>
</template>
<template id="t-notice">
  <p role="alert" class="m-0 rounded-card bg-bad-soft p-4 text-sm font-medium text-bad"></p>
</template>
<script>{{ mcp_app_js|safe }}</script>
<script>{{ wallet_js|safe }}</script>
</body>
</html>

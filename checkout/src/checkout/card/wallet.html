<body class="m-0 bg-transparent p-2 font-sans text-[0.9375rem] leading-snug text-ink">
<main id="root" class="mx-auto max-w-sm"></main>
<template id="t-wallet">
  <article class="grid grid-cols-1 gap-4 rounded-card border border-line bg-raised p-5">
    <div>
      <h2 class="m-0 text-sm font-normal text-ink-3">Wallet</h2>
      <p data-slot="balance" class="m-0 text-4xl font-semibold tracking-tight tabular-nums"></p>
    </div>
    <ul data-slot="entries" class="m-0 list-none p-0 text-sm empty:hidden"></ul>
    <div class="grid grid-cols-1 gap-2">
      <div class="flex gap-2">
        <label for="amount" class="sr-only">Amount in naira</label>
        <input id="amount" data-slot="amount" placeholder="Amount (₦)" inputmode="numeric" autocomplete="off" enterkeyhint="go" maxlength="9" class="field min-h-11 min-w-0 flex-1 py-3 tabular-nums">
        <button type="button" data-action="add" class="btn-primary w-auto shrink-0">Add money</button>
      </div>
      <button type="button" data-action="pay" data-slot="pay" class="btn-secondary" hidden></button>
      <button type="button" data-action="withdraw" data-slot="withdraw" class="btn-secondary" hidden>Withdraw</button>
    </div>
    <p data-slot="status" role="status" class="m-0 text-sm text-ink-2" hidden></p>
    <p data-slot="notice" role="alert" class="m-0 text-sm font-medium text-bad" hidden></p>
  </article>
</template>
<template id="t-withdraw">
  <article class="grid grid-cols-1 gap-4 rounded-card border border-line bg-raised p-5">
    <h2 class="m-0 text-base font-semibold">Withdraw</h2>
    <div class="grid grid-cols-1 gap-2">
      <label for="out-amount" class="sr-only">Amount in naira</label>
      <input id="out-amount" data-slot="out-amount" placeholder="Amount (₦)" inputmode="numeric" autocomplete="off" maxlength="9" class="field min-h-11 py-3 tabular-nums">
      <label for="out-bank" class="sr-only">Bank</label>
      <input id="out-bank" data-slot="out-bank" placeholder="Bank" autocomplete="off" maxlength="60" class="field min-h-11 py-3">
      <label for="out-account" class="sr-only">Account number</label>
      <input id="out-account" data-slot="out-account" placeholder="Account number" inputmode="numeric" autocomplete="off" maxlength="10" class="field min-h-11 py-3 tabular-nums">
    </div>
    <div class="flex gap-2">
      <button type="button" data-action="check" class="btn-primary">Next</button>
      <button type="button" data-action="back" class="btn-secondary">Cancel</button>
    </div>
    <p data-slot="notice" role="alert" class="m-0 text-sm font-medium text-bad" hidden></p>
  </article>
</template>
<template id="t-confirm">
  <article class="grid grid-cols-1 gap-4 rounded-card border border-line bg-raised p-5">
    <div>
      <h2 class="m-0 text-sm font-normal text-ink-3">Withdraw <span data-slot="amount" class="tabular-nums"></span> to</h2>
      <p data-slot="name" class="m-0 text-xl font-semibold wrap-anywhere"></p>
      <p data-slot="account" class="m-0 text-sm text-ink-2 tabular-nums"></p>
    </div>
    <div class="flex gap-2">
      <button type="button" data-action="confirm" class="btn-primary">Withdraw</button>
      <button type="button" data-action="back" class="btn-secondary">Cancel</button>
    </div>
    <p data-slot="notice" role="alert" class="m-0 text-sm font-medium text-bad" hidden></p>
  </article>
</template>
<template id="t-entry">
  <li class="flex justify-between gap-4 border-t border-line py-2">
    <span data-slot="label" class="min-w-0 text-ink-2"></span>
    <span data-slot="amount" class="shrink-0 whitespace-nowrap tabular-nums"></span>
  </li>
</template>
<template id="t-notice">
  <p role="alert" class="m-0 rounded-card bg-bad-soft p-4 text-sm font-medium text-bad"></p>
</template>
<script>// SPDX-License-Identifier: AGPL-3.0-or-later
// A minimal MCP Apps view: JSON-RPC 2.0 over window.postMessage to the host that framed us.
// Wire format: ext-apps specification 2026-01-26 (ui/initialize, ui/notifications/*, tools/call).
const McpApp = (() => {
  const PROTOCOL_VERSION = "2026-01-26";
  const pending = new Map();
  const handlers = new Map();
  let nextId = 1;
  let host = { capabilities: {}, context: {} };

  // The host's origin is not known to a sandboxed view, so "*" is the only target; the source
  // check on the way in is what identifies the host.
  const post = (message) => window.parent.postMessage({ jsonrpc: "2.0", ...message }, "*");

  const request = (method, params) =>
    new Promise((resolve, reject) => {
      const id = nextId++;
      pending.set(id, { resolve, reject });
      post({ id, method, params });
    });

  const notify = (method, params) => post({ method, params });

  const on = (method, handler) => handlers.set(method, handler);

  function answer(id, work) {
    Promise.resolve()
      .then(work)
      .then(
        (result) => post({ id, result: result ?? {} }),
        (error) => post({ id, error: { code: -32603, message: String(error?.message ?? error) } }),
      );
  }

  function receive(message) {
    if (message.method === "ui/notifications/host-context-changed") host.context = { ...host.context, ...message.params };
    if (typeof message.method === "string") {
      const handler = handlers.get(message.method);
      if (message.id === undefined) return handler?.(message.params);
      if (!handler) return post({ id: message.id, error: { code: -32601, message: `Method not found: ${message.method}` } });
      return answer(message.id, () => handler(message.params));
    }
    const waiting = pending.get(message.id);
    if (!waiting) return;
    pending.delete(message.id);
    if (message.error) waiting.reject(new Error(message.error.message));
    else waiting.resolve(message.result);
  }

  window.addEventListener("message", (event) => {
    const message = event.data;
    if (event.source !== window.parent || !message || message.jsonrpc !== "2.0") return;
    receive(message);
  });

  // Tells the host how tall the document is, whenever that changes.
  function reportSize() {
    let queued = false;
    let last = "";
    const measure = () => {
      if (queued) return;
      queued = true;
      requestAnimationFrame(() => {
        queued = false;
        const root = document.documentElement;
        const previous = root.style.height;
        root.style.height = "max-content";
        const height = Math.ceil(root.getBoundingClientRect().height);
        root.style.height = previous;
        const width = Math.ceil(window.innerWidth);
        if (`${width}x${height}` === last) return;
        last = `${width}x${height}`;
        notify("ui/notifications/size-changed", { width, height });
      });
    };
    measure();
    const observer = new ResizeObserver(measure);
    observer.observe(document.documentElement);
    observer.observe(document.body);
  }

  async function connect(appInfo, appCapabilities = {}) {
    const hello = await request("ui/initialize", { appInfo, appCapabilities, protocolVersion: PROTOCOL_VERSION });
    host = { capabilities: hello.hostCapabilities ?? {}, context: hello.hostContext ?? {}, info: hello.hostInfo ?? {} };
    notify("ui/notifications/initialized");
    reportSize();
    return hello;
  }

  return {
    connect,
    on,
    callTool: (name, args) => request("tools/call", { name, arguments: args }),
    openLink: (url) => request("ui/open-link", { url }),
    requestDisplayMode: (mode) => request("ui/request-display-mode", { mode }),
    host: () => host,
    message: (text) => request("ui/message", { role: "user", content: [{ type: "text", text }] }),
    updateModelContext: (text) => request("ui/update-model-context", { content: [{ type: "text", text }] }),
  };

<body class="m-0 bg-transparent p-2 font-sans text-[0.9375rem] leading-snug text-ink">
<main id="root">
  <p id="waiting" class="text-center text-ink-3" role="status">Waiting for the quote.</p>
</main>
<template id="t-card">
  <article class="mx-auto max-w-sm rounded-card border border-line bg-raised p-5" data-slot="card">
    <div data-slot="status" role="status" class="mb-4 hidden rounded-control bg-sunken px-3 py-2.5 text-ink data-[tone=bad]:bg-bad-soft data-[tone=bad]:text-bad data-[tone=ok]:bg-ok-soft data-[tone=ok]:text-ok">
      <p class="m-0 flex items-center gap-2 font-medium">
        <svg data-glyph="spin" class="hidden size-5 shrink-0 animate-spin motion-reduce:animate-none" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><circle cx="10" cy="10" r="7.5" class="opacity-25"/><path d="M10 2.5a7.5 7.5 0 0 1 7.5 7.5" stroke-linecap="round"/></svg>
        <svg data-glyph="ok" class="hidden size-5 shrink-0" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10" cy="10" r="8"/><path d="M6.5 10.5l2.5 2.5 4.5-5.5"/></svg>
        <svg data-glyph="bad" class="hidden size-5 shrink-0" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="10" cy="10" r="8"/><path d="M10 6v5M10 13.75v.01"/></svg>
        <svg data-glyph="off" class="hidden size-5 shrink-0" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="10" cy="10" r="8"/><path d="M7 10h6"/></svg>
        <span data-slot="status-text"></span>
      </p>
      <p data-slot="reason" class="m-0 mt-1 hidden text-sm text-ink-2"></p>
    </div>
    <div>
      <h2 data-slot="who" class="m-0 text-base font-medium wrap-break-word"></h2>
      <p data-slot="sub" class="m-0 hidden text-sm text-ink-3 tabular-nums wrap-break-word"></p>
      <p data-slot="amount" class="m-0 my-1 text-5xl font-semibold tracking-tight tabular-nums"></p>
      <p data-slot="what" class="m-0 hidden text-sm text-ink-3 wrap-break-word"></p>
    </div>
    <div data-slot="body" class="empty:hidden"></div>
    <p data-slot="notice" id="notice" role="alert" class="m-0 mt-4 hidden text-sm font-medium text-bad"></p>
    <div data-slot="actions" class="mt-5 empty:hidden"></div>
    <p data-slot="expiry" class="m-0 mt-3 hidden text-center text-xs text-ink-3 tabular-nums"></p>
  </article>
</template>

<template id="t-rows">
  <dl class="m-0 mt-5 text-sm" data-slot="rows"></dl>
</template>
<template id="t-row">
  <div class="flex justify-between gap-4 border-t border-line py-2">
    <dt data-slot="label" class="min-w-0 text-ink-3"></dt>
    <dd data-slot="value" class="m-0 shrink-0 whitespace-nowrap text-right tabular-nums"></dd>
  </div>
</template>
<template id="t-tracker">
  <ol class="m-0 ms-2 mt-5 list-none p-0 text-sm" aria-label="Order progress" data-slot="steps"></ol>
</template>
<template id="t-step">
  <li class="relative border-s-2 border-line-strong pb-3 ps-6 leading-5 text-ink-3 last:border-transparent last:pb-0">
    <span data-slot="dot" class="absolute -start-[calc(0.5rem+1px)] top-0 grid size-4 place-items-center rounded-full border-2 border-line-strong bg-raised">
      <svg data-slot="check" class="hidden size-2.5 text-ground" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 6.5l2.5 2.5 4.5-5.5"/></svg>
    </span>
    <span data-slot="name"></span>
  </li>
</template>

<template id="t-approval">
  <div class="grid gap-2">
    <button type="button" data-action="approve" class="btn-primary">Approve</button>
    <button type="button" data-action="decline" class="btn-quiet">Decline</button>
    <div class="mt-1 flex items-center gap-2">
      <label for="correction" class="sr-only">Correction</label>
      <input id="correction" data-slot="correction" placeholder="Correction" maxlength="300" autocomplete="off" enterkeyhint="send" class="min-w-0 flex-1 rounded-control border border-line-strong bg-transparent px-3 py-3 outline-offset-2 placeholder:text-ink-3 focus-ring">
      <button type="button" data-action="correct" aria-label="Send correction" class="btn-quiet shrink-0">Send</button>
    </div>
  </div>
</template>
<template id="t-checkout">
  <div class="grid gap-2">
    <button type="button" data-action="open-checkout" class="btn-primary">Open checkout</button>
    <button type="button" data-action="closed-checkout" class="btn-quiet">I closed it</button>
  </div>
</template>
<template id="t-otp">
  <div class="grid gap-3">
    <label for="otp" class="sr-only">One-time code</label>

<script>// SPDX-License-Identifier: AGPL-3.0-or-later
// A minimal MCP Apps view: JSON-RPC 2.0 over window.postMessage to the host that framed us.
// Wire format: ext-apps specification 2026-01-26 (ui/initialize, ui/notifications/*, tools/call).
const McpApp = (() => {
  const PROTOCOL_VERSION = "2026-01-26";
  const pending = new Map();
  const handlers = new Map();
  let nextId = 1;
  let host = { capabilities: {}, context: {} };

  // The host's origin is not known to a sandboxed view, so "*" is the only target; the source
  // check on the way in is what identifies the host.
  const post = (message) => window.parent.postMessage({ jsonrpc: "2.0", ...message }, "*");

  const request = (method, params) =>
    new Promise((resolve, reject) => {
      const id = nextId++;
      pending.set(id, { resolve, reject });
      post({ id, method, params });
    });

  const notify = (method, params) => post({ method, params });

  const on = (method, handler) => handlers.set(method, handler);

  function answer(id, work) {
    Promise.resolve()
      .then(work)
      .then(
        (result) => post({ id, result: result ?? {} }),
        (error) => post({ id, error: { code: -32603, message: String(error?.message ?? error) } }),
      );
  }

  function receive(message) {
    if (message.method === "ui/notifications/host-context-changed") host.context = { ...host.context, ...message.params };
    if (typeof message.method === "string") {
      const handler = handlers.get(message.method);
      if (message.id === undefined) return handler?.(message.params);
      if (!handler) return post({ id: message.id, error: { code: -32601, message: `Method not found: ${message.method}` } });
      return answer(message.id, () => handler(message.params));
    }
    const waiting = pending.get(message.id);
    if (!waiting) return;
    pending.delete(message.id);
    if (message.error) waiting.reject(new Error(message.error.message));
    else waiting.resolve(message.result);
  }

  window.addEventListener("message", (event) => {
    const message = event.data;
    if (event.source !== window.parent || !message || message.jsonrpc !== "2.0") return;
    receive(message);
  });

  // Tells the host how tall the document is, whenever that changes.
  function reportSize() {
    let queued = false;
    let last = "";
    const measure = () => {
      if (queued) return;
      queued = true;
      requestAnimationFrame(() => {
        queued = false;
        const root = document.documentElement;
        const previous = root.style.height;
        root.style.height = "max-content";
        const height = Math.ceil(root.getBoundingClientRect().height);
        root.style.height = previous;
        const width = Math.ceil(window.innerWidth);
        if (`${width}x${height}` === last) return;
        last = `${width}x${height}`;
        notify("ui/notifications/size-changed", { width, height });
      });
    };
    measure();
    const observer = new ResizeObserver(measure);
    observer.observe(document.documentElement);
    observer.observe(document.body);
  }

  async function connect(appInfo, appCapabilities = {}) {
    const hello = await request("ui/initialize", { appInfo, appCapabilities, protocolVersion: PROTOCOL_VERSION });
    host = { capabilities: hello.hostCapabilities ?? {}, context: hello.hostContext ?? {} };
    notify("ui/notifications/initialized");
    reportSize();
    return hello;
  }

  return {
    connect,
    on,
    callTool: (name, args) => request("tools/call", { name, arguments: args }),
    openLink: (url) => request("ui/open-link", { url }),
    requestDisplayMode: (mode) => request("ui/request-display-mode", { mode }),
    host: () => host,
    message: (text) => request("ui/message", { role: "user", content: [{ type: "text", text }] }),
    updateModelContext: (text) => request("ui/update-model-context", { content: [{ type: "text", text }] }),
  };
})();
</script>
<script>// SPDX-License-Identifier: AGPL-3.0-or-later
// Paystack's checkout as a popup inside the card (Paystack Inline v2, `resumeTransaction(access_code)`), as an
// option: it is used only where it can run, and anywhere it cannot the card opens the checkout link as it always
// did, with nothing for the person to read. The popup is a frame of Paystack's own that fills the window of the
// page that opens it, so the card first asks the host for full screen.
//
// It runs only when the host says it lets a card have Paystack's two origins (`hostCapabilities.sandbox.csp`) and
// offers full screen, the card holds a transaction's access code, the script loads without a policy violation,
// and the popup reports that it has loaded within a time limit. What the popup says about the payment is a hint to
// look again; the server's own record decides.
const InlineCheckout = (() => {
  const SCRIPT = "https://js.paystack.co/v2/inline.js";
  const NEEDS = { resourceDomains: "https://js.paystack.co", frameDomains: "https://checkout.paystack.com" };
  const SCRIPT_MS = 8000;
  const LOAD_MS = 12000;
  let attempt = null;
  let gaveUp = false;

  const approved = (capabilities) =>
    Object.entries(NEEDS).every(([field, origin]) => capabilities.sandbox?.csp?.[field]?.includes(origin));

  /** Whether this host could show the popup: cheap to ask, and free of any request to Paystack. */
  function hostAllows() {
    const { capabilities, context } = McpApp.host();
    return !gaveUp && approved(capabilities) && Boolean(context.availableDisplayModes?.includes("fullscreen"));
  }

  /** The first policy violation the page reports while the popup is being set up, if any. */
  function watchPolicy() {
    const seen = { directive: null };
    const note = (event) => (seen.directive ??= event.violatedDirective);
    addEventListener("securitypolicyviolation", note);
    return {
      stop: () => removeEventListener("securitypolicyviolation", note),
      /** A violation is reported a moment after the request that caused it, so this waits one turn first. */
      async assertClean(what) {
        await new Promise((done) => setTimeout(done, 0));
        if (seen.directive) throw new Error(`${what}: blocked by policy (${seen.directive})`);
      },
    };
  }

  /** A promise that ends when `work` settles or when `ms` pass. */
  function guarded(work, ms, what) {
    return new Promise((resolve, reject) => {
      const timer = setTimeout(() => reject(new Error(`${what}: no answer in ${ms} ms`)), ms);
      work(
        (value) => (clearTimeout(timer), resolve(value)),
        (error) => (clearTimeout(timer), reject(error)),
      );
    });
  }

  const loadScript = () =>
    guarded(
      (done, fail) => {
        if (window.PaystackPop) return done();
        const script = document.createElement("script");
        script.src = SCRIPT;
        script.onload = () => done();
        script.onerror = () => fail(new Error("the script did not load"));
        document.head.append(script);
      },
      SCRIPT_MS,
      "script",
    );

  /** Thrown when the person (Close, Escape) or the server ends the attempt while it is still loading. */
  class Stopped extends Error {}
  const unlessStopped = (now) => {
    if (now.stopped) throw new Stopped("the attempt was ended");
  };

  /** Opens the transaction in the popup; resolves once the popup has loaded it. */
  const resume = (now, code, hear) =>
    guarded(
      (done, fail) => {
        now.popup.resumeTransaction(code, {
          onLoad: () => done(),
          onError: (error) => (now.loaded ? hear.error(error) : fail(new Error(error?.message ?? "the popup reported an error"))),
          onSuccess: () => hear.success(),
          onCancel: () => hear.cancel(),
        });
      },
      LOAD_MS,
      "popup",
    );

  const leave = () => McpApp.requestDisplayMode("inline").catch(() => undefined);

  const closeQuietly = (popup) => {
    try {
      popup?.close();
    } catch (error) {
      console.info("Paystack's popup did not close cleanly.", error.message);
    }
  };

  /** Shows the popup full window; throws when it cannot be shown or the attempt is ended on the way. */
  async function show(now, code, hear, policy) {
    await loadScript();
    unlessStopped(now);
    await policy.assertClean("script");
    now.popup = new window.PaystackPop();
    const window_ = await McpApp.requestDisplayMode("fullscreen");
    if (window_?.mode !== "fullscreen") throw new Error("the host would not go full screen");
    unlessStopped(now);
    await resume(now, code, hear);
    await policy.assertClean("popup");
    unlessStopped(now);
    now.loaded = true;
  }

  /**
   * Shows the popup for `code`. Resolves true once it is showing or being loaded, false when it cannot be shown
   * (the card then uses the link, and does not try the popup again). `hear` has `success`, `cancel` and `error`,
   * called after the popup has closed and the card is back in the page. An attempt is held from its first
   * moment, so a second press during the load, or a Close during it, is answered.
   */
  async function open(code, hear) {
    if (attempt) return true;
    if (!code || !hostAllows()) return false;
    const now = { popup: null, loaded: false, stopped: false };
    attempt = now;
    const finish = (say) => () => {
      if (attempt !== now) return;
      attempt = null;
      leave().then(say);
    };
    const policy = watchPolicy();
    try {
      await show(now, code, { success: finish(hear.success), cancel: finish(hear.cancel), error: finish(hear.error) }, policy);
      return true;
    } catch (error) {
      if (attempt === now) attempt = null;
      closeQuietly(now.popup);
      await leave();
      if (error instanceof Stopped) {
        hear.cancel();
        return true;
      }
      gaveUp = true;
      console.info("Paystack's popup could not be used; opening the link instead.", error.message);
      return false;
    } finally {
      policy.stop();
    }
  }

  /** The person left full screen (Close, Escape) while the popup was loading or up: it is dismissed as a cancel. */
  function displayChanged(mode) {
    if (mode !== "inline" || !attempt) return;
    if (attempt.loaded) attempt.popup.cancelTransaction();
    else {
      attempt.stopped = true;
      closeQuietly(attempt.popup);
    }
  }

  /** The server says the quote is over (paid, declined, expired) while the popup is loading or up: put the card back. */
  function dismiss() {
    if (!attempt) return;
    const now = attempt;
    attempt = null;
    now.stopped = true;
    closeQuietly(now.popup);
    void leave();
  }

  return { open, hostAllows, displayChanged, dismiss };
})();
</script>
<script>// SPDX-License-Identifier: AGPL-3.0-or-later
// The approval card: shows a quote as the server holds it, and lets the person act on it.
// Markup lives in the Django templates (<template> elements); this file only fills them in.
(() => {
  const POLL_MS = 2000;
  const FINISHED = ["succeeded", "attention", "failed", "abandoned", "expired", "declined", "unavailable"];
  const state = { quote: null, token: null, accessCode: null, busy: false, notice: null, shown: "", told: null, polling: false };
  const root = document.getElementById("root");

  const fromTemplate = (id) => document.getElementById(id).content.firstElementChild.cloneNode(true);
  const slot = (node, name) => (node.dataset.slot === name ? node : node.querySelector(`[data-slot="${name}"]`));
  const setText = (node, name, text) => {
    const target = slot(node, name);
    target.textContent = text ?? "";
    target.classList.toggle("hidden", !text);
  };

  // The word and glyph a phase gives itself; a "reason" phase adds the first sentence of the server's message.
  const STATUS = {
    processing: { glyph: "spin", tone: "neutral", text: "Processing" },
    succeeded: { glyph: "ok", tone: "ok" },
    attention: { glyph: "bad", tone: "bad", text: "Refund due", reason: true },
    unavailable: { glyph: "bad", tone: "bad", text: "Not sent", reason: true },
    failed: { glyph: "bad", tone: "bad", text: "Not charged", reason: true },
    abandoned: { glyph: "off", tone: "neutral", text: "Not charged" },
    declined: { glyph: "off", tone: "neutral", text: "Declined" },
    expired: { glyph: "off", tone: "neutral", text: "Expired" },
    gone: { glyph: "off", tone: "neutral", text: "No longer available" },
  };
  const NO_MONEY_MOVED = ["failed", "unavailable", "abandoned", "declined", "expired"];
  const PLAIN_SUB = ["text-sm", "text-ink-3"];
  const PHONE_SUB = ["text-base", "font-medium", "text-ink"];
  const isReference = (label) => /reference|request/i.test(label);
  const firstSentence = (text) => (text ?? "").split(/(?<=[.!?])\s+/)[0];

  // Who the money goes to: the two lines above the amount, and what for below it.
  const whoOf = (q) => {
    const d = q.details;
    switch (d.kind) {
      case "transfer": return d.recipientName;
      case "airtime": return `${d.network} airtime`;
      case "data": return `${d.network} data`;
      default: return q.merchant;
    }
  };
  const subOf = (q) => {
    const d = q.details;
    switch (d.kind) {
      case "transfer": return `${d.bankName} · ${d.accountMasked}`;
      case "airtime":
      case "data": return d.phone;
      case "food": return `${q.phase === "succeeded" ? "Delivered" : "Deliver"} to ${d.area}`;
      default: return q.merchantRef ? `Order ${q.merchantRef}` : "";
    }
  };
  const orderOf = (q) =>
    [whoOf(q), q.details.kind === "data" ? q.details.plan : "", subOf(q), q.amount.display].filter(Boolean).join(", ");
  const whatOf = (q) => (q.details.kind === "data" ? q.details.plan : q.details.kind === "airtime" || q.details.kind === "food" ? "" : q.description);

  function rows(pairs) {
    const list = fromTemplate("t-rows");
    for (const [label, value] of pairs) {
      const row = fromTemplate("t-row");
      const cell = slot(row, "value");
      slot(row, "label").textContent = label;
      cell.textContent = value;
      if (isReference(label)) {
        row.classList.remove("justify-between", "gap-4");
        row.classList.add("flex-col", "gap-0.5");
        cell.classList.replace("text-right", "text-left");
        cell.classList.remove("shrink-0", "whitespace-nowrap");
        cell.classList.add("break-all");
        cell.classList.add("font-mono", "text-xs", "text-ink-2");
      }
      slot(list, "rows").append(row);
    }
    return list;
  }

  const basket = (q) => rows([...q.details.lines.map((l) => [`${l.quantity} × ${l.name}`, l.total]), ["Delivery", q.details.deliveryFee]]);

  function tracker(q) {
    const list = fromTemplate("t-tracker");
    q.tracking.steps.forEach((name, index) => {
      const step = fromTemplate("t-step");
      const dot = slot(step, "dot");
      slot(step, "name").textContent = name;
      const restyle = (node, drop, add) => { node.classList.remove(...drop); node.classList.add(...add); };
      if (index < q.tracking.current) {
        restyle(step, ["border-line-strong", "text-ink-3"], ["border-ok", "text-ink-2"]);
        restyle(dot, ["border-line-strong", "bg-raised"], ["border-ok", "bg-ok"]);
        slot(step, "check").classList.remove("hidden");
      }
      if (index === q.tracking.current) {
        restyle(step, ["text-ink-3"], ["font-semibold", "text-ink"]);
        restyle(dot, ["border-line-strong", "bg-raised"], ["border-ink", "bg-ink", "outline-4", "outline-line-strong", "motion-safe:animate-pulse"]);
        step.setAttribute("aria-current", "step");
      }
      slot(list, "steps").append(step);
    });
    return list;
  }

  // What the amount, recipient and plan already say is left out of the receipt.
  const SHOWN_ABOVE = ["Amount", "Mode", "For", "Merchant", "To", "Bank", "Account", "Network", "Number", "Plan", "Total", "Delivered to"];
  const receipt = (q) => rows(q.receipt.lines.filter((l) => !SHOWN_ABOVE.includes(l.label)).map((l) => [l.label, l.value]));

  const otpNote = (hint) => (hint ?? "").split(/(?<=\.)\s+/).filter((sentence) => !/^Enter\b/.test(sentence)).join(" ");

  function actions(q) {
    switch (q.phase) {
      case "awaiting_approval": {
        const node = fromTemplate("t-approval");
        return node;
      }
      case "awaiting_checkout": return fromTemplate("t-checkout");
      case "awaiting_otp": {
        const node = fromTemplate("t-otp");
        setText(node, "hint", otpNote(q.otpHint));
        return node;
      }
      default: return null;
    }
  }

  function showStatus(card, q) {
    const status = STATUS[q.phase];
    if (!status || q.tracking) return;
    const block = slot(card, "status");
    block.classList.remove("hidden");
    block.dataset.tone = status.tone;
    block.querySelector(`[data-glyph="${status.glyph}"]`).classList.remove("hidden");
    setText(card, "status-text", status.text ?? q.receipt?.title ?? "Done");
    if (status.reason) setText(card, "reason", firstSentence(q.message));
  }

  const showNotice = (card, text) => {
    setText(card, "notice", text?.replace(/^[A-Z][A-Z_]+:\s*/, ""));
    const code = card.querySelector('[data-slot="otp"]');
    if (!code || !text) return;
    code.setAttribute("aria-invalid", "true");
    code.setAttribute("aria-describedby", "notice");
  };

  function draw() {
    const q = state.quote;
    document.getElementById("waiting")?.remove();
    const card = fromTemplate("t-card");
    card.dataset.phase = q.phase;
    setText(card, "who", whoOf(q));
    setText(card, "amount", q.amount.display);
    if (NO_MONEY_MOVED.includes(q.phase)) slot(card, "amount").classList.add("line-through", "text-ink-3");
    setText(card, "what", whatOf(q));
    const sub = slot(card, "sub");
    setText(card, "sub", subOf(q));
    if (q.details.kind === "airtime" || q.details.kind === "data") {
      sub.classList.remove(...PLAIN_SUB);
      sub.classList.add(...PHONE_SUB);
    }
    showStatus(card, q);
    const body = slot(card, "body");
    if (q.details.kind === "food" && ["awaiting_approval", "awaiting_checkout"].includes(q.phase)) body.append(basket(q));
    if (q.tracking) body.append(tracker(q));
    if (q.receipt) body.append(receipt(q));
    const controls = actions(q);
    if (controls) slot(card, "actions").append(controls);
    showNotice(card, state.notice);
    root.replaceChildren(card);
    if (state.notice) root.querySelector('[data-slot="otp"]')?.focus();
    syncBusy();
    tick();
  }

  function syncBusy() {
    root.querySelectorAll("button").forEach((button) => { button.disabled = state.busy; });
  }

  const countdown = (ms) => {
    const total = Math.max(Math.ceil(ms / 1000), 0);
    return `${Math.floor(total / 60)}:${String(total % 60).padStart(2, "0")}`;
  };

  function tick() {
    const target = root.querySelector('[data-slot="expiry"]');
    if (!target || state.quote?.phase !== "awaiting_approval") return;
    const left = Date.parse(state.quote.expiresAt) - Date.now();
    target.classList.toggle("hidden", left >= 60000);
    target.textContent = left <= 0 ? "Expired" : `Expires ${countdown(left)}`;
    if (left <= 0 && !state.expiredAsked) {
      state.expiredAsked = true;
      run("verify_quote", {});
    }
  }

  // What a tool result means to this card: a quote, or the reason there is none. A connector that does not know
  // the quote (it was made for another owner: the chat moved to an account) has nothing to act on: the card is over.
  function outcomeOf(result) {
    const refusal = result.isError ? result.content?.find((b) => b.type === "text")?.text ?? "" : "";
    if (/^QUOTE_NOT_FOUND\b/.test(refusal)) return { gone: true, message: refusal };
    if (result.isError) return { message: result.content?.find((b) => b.type === "text")?.text ?? "The request was refused." };
    const quote = result.structuredContent?.quote;
    if (!quote) return { message: result.content?.find((b) => b.type === "text")?.text ?? "The server sent a reply this card cannot show." };
    return { quote, token: result._meta?.approvalToken ?? null, accessCode: result._meta?.paystack?.accessCode ?? null };
  }

  function apply(outcome) {
    if (outcome.gone && state.quote) {
      state.quote = { ...state.quote, phase: "gone", poll: false, checkoutUrl: null, tracking: null, receipt: null };
      state.accessCode = null;
      state.notice = null;
      InlineCheckout.dismiss();
    } else if (outcome.quote) {
      if (outcome.token) state.token = outcome.token;
      if (outcome.accessCode) state.accessCode = outcome.accessCode;
      if (outcome.quote.phase !== "awaiting_checkout") {
        state.accessCode = null;
        InlineCheckout.dismiss();
      }
      if (state.quote?.id !== outcome.quote.id) state.expiredAsked = false;
      state.quote = outcome.quote;
      state.notice = null;
    } else {
      state.notice = outcome.message;
    }
    const shown = JSON.stringify([state.quote, state.notice]);
    if (state.quote && shown !== state.shown) {
      state.shown = shown;
      draw();
    }
    tellModel();
    return outcome;
  }

  function tellModel() {
    const q = state.quote;
    if (!q || !FINISHED.includes(q.phase) || state.told === q.phase) return;
    state.told = q.phase;
    const what = q.receipt?.title ?? q.phase.replace(/_/g, " ");
    const text = `The person's card for quote ${q.id} (${q.amount.display}) now shows: ${what}. ${q.message ?? ""}`.trim();
    McpApp.updateModelContext(text).catch(() => undefined);
  }

  async function call(tool, args) {
    try {
      return outcomeOf(await McpApp.callTool(tool, args));
    } catch {
      return { message: "The connection to the server was lost. This card will try again." };
    }
  }

  async function run(tool, args) {
    state.busy = true;
    syncBusy();
    try {
      return apply(await call(tool, { quote_id: state.quote.id, ...args }));
    } finally {
      state.busy = false;
      syncBusy();
    }
  }

  // The popup is tried first where the host allows it; whatever stops it, the link opens as it always did.
  async function openCheckout() {
    if (!state.accessCode && InlineCheckout.hostAllows()) await run("verify_quote", {});
    if (state.quote.phase !== "awaiting_checkout") return;
    const opened = await InlineCheckout.open(state.accessCode, {
      success: () => run("verify_quote", {}),
      cancel: () => undefined,
      error: () => openLink(),
    });
    if (!opened) await openLink();
  }

  async function openLink() {
    const ok = await McpApp.openLink(state.quote.checkoutUrl).then((r) => r?.isError !== true, () => false);
    if (!ok) apply({ message: 'The checkout window was blocked. Press "Open checkout again".' });
  }

  const actionsByName = {
    approve: async () => {
      const outcome = await run("approve_quote", {
        approval_token: state.token ?? "",
        displayed_amount_kobo: state.quote.amount.kobo,
        readback_confirmed: true,
      });
      if (outcome.quote?.checkoutUrl) openCheckout();
    },
    decline: () => run("decline_quote", { approval_token: state.token ?? "" }),
    correct: () => sendCorrection(),
    "open-checkout": () => openCheckout(),
    "closed-checkout": () => run("verify_quote", { checkout_closed: true }),
    otp: () => submitOtp(),
  };

  root.addEventListener("click", (event) => {
    const name = event.target.closest("[data-action]")?.dataset.action;
    if (name && actionsByName[name]) actionsByName[name]();
  });
  root.addEventListener("change", syncBusy);
  // A sandboxed view may not submit forms, so the code is sent by the button or by Enter in its field.
  function submitOtp() {
    const code = root.querySelector('[data-slot="otp"]').value.trim();
    if (code.length >= 4) run("submit_otp", { otp: code });
  }
  async function sendCorrection() {
    const field = root.querySelector('[data-slot="correction"]');
    const text = field.value.trim();
    if (!text) return;
    const order = orderOf(state.quote);
    await run("decline_quote", { approval_token: state.token ?? "" });
    McpApp.message(`Correction to the card for ${order}: ${text}`).catch(() => undefined);
  }
  root.addEventListener("keydown", (event) => {
    if (event.key !== "Enter") return;
    if (event.target.dataset.slot === "otp") submitOtp();
    if (event.target.dataset.slot === "correction") sendCorrection();
  });

  let lastPoll = 0;
  setInterval(() => {
    tick();
    const q = state.quote;
    if (!q?.poll || state.polling || Date.now() - lastPoll < POLL_MS) return;
    state.polling = true;
    lastPoll = Date.now();
    call("verify_quote", { quote_id: q.id }).then(apply).finally(() => { state.polling = false; });
  }, 1000);

  McpApp.on("ui/notifications/tool-result", (result) => { apply(outcomeOf(result)); });
  McpApp.on("ui/notifications/tool-input", () => undefined);
  McpApp.on("ui/notifications/tool-cancelled", () => apply({ message: "The request was cancelled." }));
  McpApp.on("ui/resource-teardown", () => ({}));
  const themed = (context) => {
    if (context?.theme) for (const theme of ["dark", "light"]) document.documentElement.classList.toggle(theme, context.theme === theme);
  };
  McpApp.on("ui/notifications/host-context-changed", (context) => {
    themed(context);
    if (context?.displayMode) InlineCheckout.displayChanged(context.displayMode);
  });
  themed({ theme: matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light" });

  McpApp.connect({ name: "234 card", version: "0.1.0" }).then(
    (hello) => themed(hello.hostContext),
    (error) => { root.textContent = `Could not connect to the chat: ${error.message}`; },
  );
})();
</script>
</body>
</html>
